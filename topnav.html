<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio Navbar</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    .navbar-brand {
      font-weight: bold;
      letter-spacing: 2px;
      color: #4cc3a1 !important;
    }
    .navbar-nav .nav-link {
      letter-spacing: 1px;
      cursor: pointer;
    }
    .btn-try {
      border: 1px solid black;
      padding: 2px 8px;
      font-size: 14px;
    }
    html {
      scroll-behavior: smooth;
    }
    section {
      padding: 100px 0;
    }
  </style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg bg-white border-bottom">
  <div class="container">
    <a class="navbar-brand" href="#">TASMIA TASMIN</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    
    <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
      <ul class="navbar-nav align-items-lg-center">
        <li class="nav-item">
          <a class="nav-link" id="about-link">ABOUT</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#services">SERVICES</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#resume">RESUME</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#contact">CONTACT</a>
        </li>
        <li class="nav-item">
          <a href="#try" class="btn btn-light btn-try ms-lg-2">Try it</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<!-- MAIN CONTENT -->
<div id="main-content" class="container">
  <section id="services">
    <h2>Services</h2>
    <p>Some information about services...</p>
  </section>

  <section id="resume">
    <h2>Resume</h2>
    <p>Details about my resume...</p>
  </section>

  <section id="contact">
    <h2>Contact</h2>
    <p>Contact information goes here...</p>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  document.getElementById("about-link").addEventListener("click", function (e) {
    e.preventDefault(); // prevent default link behavior
    
    // Load content dynamically from about.html
    fetch("about.html")
      .then(response => response.text())
      .then(data => {
        document.getElementById("main-content").innerHTML = data;
        window.scrollTo({ top: 0, behavior: "smooth" }); // scroll to top after load
      })
      .catch(err => {
        console.error("Error loading about.html:", err);
      });
  });
</script>

</body>
</html>
