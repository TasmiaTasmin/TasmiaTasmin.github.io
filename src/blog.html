<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blog Listing</title>
    <meta name="description" content="Lovable Generated Project" />
    <meta name="author" content="Lovable" />
    <meta property="og:image" content="/og-image.png" />
    <link rel="stylesheet" href="/src/styles.css">
  </head>
  <body>
    <div class="min-h-screen py-12 px-4 sm:px-6 lg:px-8">
      <div class="max-w-7xl mx-auto">
        <div class="text-left mb-12">
          <h1 class="text-4xl font-bold mb-4">
            Recent <span class="text-primary">Blogs</span>
          </h1>
          <p class="text-muted-foreground text-lg">
            Discover my latest blog entries, sharing insights and stories on various topics.
          </p>
        </div>
        
        <div class="grid gap-8 md:grid-cols-2" id="blog-grid">
          <!-- Blog posts will be inserted here by JavaScript -->
        </div>
        
        <div class="mt-12 text-center">
          <button class="px-6 py-3 rounded-full bg-secondary hover:bg-secondary/80 text-secondary-foreground font-medium transition-colors">
            Show More
          </button>
        </div>
      </div>
    </div>
    <script src="/src/main.js" type="module"></script>
  </body>
</html>
