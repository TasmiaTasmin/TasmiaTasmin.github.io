  <!DOCTYPE html>
  <html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recent Blogs</title>
    <style>
        .blog-list {
  display: flex;
  justify-content: center;
  gap: 20px;
  flex-wrap: wrap;
}

.blog-card {
  display: flex;
  background: #fff;
  border: 1px solid #e0e0e0;
  border-radius: 8px;
  max-width: 700px;
  box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
}

.blog-card img {
  width: 200px; /* Adjust image size */
  height: auto;
  border-top-left-radius: 8px;
  border-bottom-left-radius: 8px;
}

.blog-content {
  padding: 20px;
  flex: 1; /* Ensure the content takes up the rest of the space */
}

.blog-content h3 {
  font-size: 1.5em;
  margin-bottom: 10px;
}

.blog-content p {
  color: #777;
  margin-bottom: 15px;
}

.tags {
  display: flex;
  gap: 10px;
  margin-bottom: 10px;
}

.tags span {
  background: #e0f7fa;
  color: #00796b;
  padding: 5px 10px;
  border-radius: 4px;
  font-size: 0.8em;
}

.meta {
  color: #999;
  font-size: 0.9em;
  margin-bottom: 10px;
}

.read-more {
  color: #00796b;
  text-decoration: none;
  font-weight: bold;
}

.read-more:hover {
  text-decoration: underline;
}


    </style>
  </head>
  <body>
    <div class="blog-card">
        <img src="virtualization.png" alt="Virtualization and Virtual Machines">
        <div class="blog-content">
          <h3>Virtualization and Virtual Machines</h3>
          <p>Why virtualization is necessary</p>
          <div class="tags">
            <span>VMs</span>
            <span>DevOps</span>
            <span>SRE</span>
          </div>
          <div class="meta">
            <span>📅 Saturday, March 04, 2023</span>
            <span>👤 Sabbir Ahmed</span>
          </div>
          <a href="#" class="read-more">Read More</a>
        </div>
      </div>
  </body>
  </html>
